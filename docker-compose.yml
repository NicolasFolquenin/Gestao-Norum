version: '3.8'

services:
  web:
    build:
      context: .
    container_name: norum-app-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  api:
    build:
      context: ./server
    container_name: norum-app-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://norum:senha-segura-123@db:5432/norumdb
      - JWT_SECRET=sua-super-senha-secreta
      - ADMIN_USER=admin
      - ADMIN_PASS=senha123
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: norum-app-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=norum
      - POSTGRES_PASSWORD=senha-segura-123
      - POSTGRES_DB=norumdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
